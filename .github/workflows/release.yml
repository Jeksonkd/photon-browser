name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjson-glib-dev libsoup-3.0-dev pkg-config build-essential

      - name: Build
        run: make

      - name: Package AppImage
        run: |
          mkdir -p PhotonLight.AppDir/usr/bin
          cp photon-light PhotonLight.AppDir/usr/bin/
          cat > PhotonLight.AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/photon-light" "$@"
          EOF
          chmod +x PhotonLight.AppDir/AppRun
          cat > PhotonLight.AppDir/photon-light.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Photon Light
          Exec=photon-light
          Icon=photon-light
          Categories=Network;WebBrowser;
          EOF
          cp assets/logo.png PhotonLight.AppDir/photon-light.png
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run PhotonLight.AppDir PhotonLight-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            photon-light
            PhotonLight-x86_64.AppImage

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-artifacts/photon-light
            linux-artifacts/PhotonLight-x86_64.AppImage
